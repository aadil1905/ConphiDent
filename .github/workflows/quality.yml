name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: conphident_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d conphident_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:test-password@localhost:5432/conphident_test?schema=public
      DIRECT_URL: postgresql://postgres:test-password@localhost:5432/conphident_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:test-password@localhost:5432/conphident_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run verify
      - run: npm run build
